<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mengalihkan...</title>
    <script type="text/javascript">
      // Trik redirect standar untuk Single Page App (React Router) di GitHub Pages.
      // Sumber: https://github.com/rafgraph/spa-github-pages
      // pathSegmentsToKeep = 1 karena situs ini ada di
      // suportteam116.github.io/Dashboard-Management-Habeha/...
      // (1 segmen path yaitu "Dashboard-Management-Habeha" harus dipertahankan)
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
